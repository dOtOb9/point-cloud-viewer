name: Release

# タグ push (`v*`) の時だけ走る。ci.yml とは別ファイルにしてある理由は
# TaskSheets/M3-release-and-update.md M3-1 参照（目的も所要時間も違うため）。
#
# workflow_dispatch: タグを打たずに手動で走らせる経路（2026-09-23追加）。
# android ジョブは元々タグが無いと走らない（`push: tags`でしか起きない）ため、
# 「androidのビルド部分だけを事前に試す」手段が無かった。手動実行の場合は
# GitHub Releaseへのアップロードを行わない（下記の各アップロードstepを
# `startsWith(github.ref, 'refs/tags/')`で止めている）。ビルドの成否だけを
# 確認する経路であり、Releaseを作る経路ではない。
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  # タグと tauri.conf.json の version が食い違ったまま Release を作ってしまうと、
  # 利用者から見たバージョン表示が混乱する。ここで検査し、違っていたら他のジョブが
  # 始まる前に落とす（黙って進めない。M3-1の受け入れ条件）。
  #
  # workflow_dispatchでの手動実行はタグ経由ではない（github.refがブランチになる）ため、
  # この検査自体を意味を持たせられない。タグpush時だけ実行する。
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: タグと tauri.conf.json の version が一致することを確認する
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$conf_version" ]; then
            echo "::error::タグ(${GITHUB_REF_NAME})とsrc-tauri/tauri.conf.jsonのversion(${conf_version})が一致しません。タグを打つ前にtauri.conf.jsonのversionを合わせてください。"
            exit 1
          fi
          echo "OK: v${conf_version} でタグとversionが一致しています。"

  # Windows向けのMSI/NSISインストーラをビルドし、GitHub Releasesに添付する。
  #
  # 所有者の方針(2026-09-23時点、ADR-0004追記4): 当面は署名鍵を作らない。
  # そのためコード署名は行わず、TAURI_SIGNING_PRIVATE_KEY等のSecretsも参照しない
  # (署名なしの自動更新manifestを作る意味が無いため、latest.jsonの生成もしない。
  # 更新通知は自前のGitHub API確認に一本化した。src/datasource/update-check.ts参照)。
  # 無署名のインストーラはWindows SmartScreenの警告が出る。これはリリース本文に明記する。
  windows:
    needs: check-version
    runs-on: windows-latest
    # GitHub Releaseの作成・アセット添付にはデフォルトのGITHUB_TOKENに
    # contents: write権限が要る（無いと"Resource not accessible by integration"の
    # 403で失敗する。2026-09-23、実際にv0.1.0タグで再現した）。他の権限は使わないので
    # 必要最小限としてcontents: writeだけをこのジョブに付ける。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: tauri build (msi + nsis, 無署名)
        run: npm run tauri build
      # ルートのCargo.tomlが`members = ["crates/pcv-core", "src-tauri"]`のワークスペース
      # なので、ビルド成果物は`src-tauri/target/`ではなく**リポジトリ直下の`target/`**に出る
      # (cargoはワークスペースルートを1つのtarget/にまとめる)。2026-09-23、v0.1.0タグの
      # run 35847261259で`src-tauri/target/release/bundle/...`を指定していたために
      # ファイルが1つも見つからず(action-gh-releaseが既定ではそれをエラーにしないため)、
      # インストーラ抜きのReleaseが「成功」として公開される事故があった。
      # このstepで実際の出力を毎回ログに残し、次に同じ形の不具合が起きても
      # 気付けるようにする。
      - name: ビルド成果物を確認する
        shell: bash
        run: |
          echo "--- target/release/bundle 以下 ---"
          find target/release/bundle -type f 2>&1 || echo "(target/release/bundle が見つかりません)"
      - name: Upload installers to GitHub Release
        # workflow_dispatchでの手動実行ではReleaseを作らない（ビルド確認だけの経路）。
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          # 添付対象のファイルが1つも見つからない場合、既定ではこのstep自体は
          # 「成功」してしまい、インストーラ抜きのReleaseがそのまま公開される
          # (実際に2026-09-23、v0.1.0で発生した)。必ずジョブを落として気付けるようにする。
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **このインストーラには署名がありません。** Windows SmartScreenが
            「発行元不明」の警告を出す場合がありますが、これはコード署名証明書を
            導入していないためです（ADR-0004参照）。

  # Android向けのdebug署名APKをビルドし、GitHub Releasesに添付する。
  # M3-3参照。windowsジョブとは独立させ、こちらが失敗してもWindowsのリリースは
  # 成立する。ただしGitHub Release自体の作成/アセット追加が競合しないよう、
  # windowsジョブの後に実行する（windowsの成否そのものには依存しない。
  # `if`でcheck-versionの成功だけを条件にしている）。
  android:
    needs: [check-version, windows]
    if: ${{ !cancelled() && needs.check-version.result == 'success' }}
    runs-on: ubuntu-latest
    # windowsジョブと同じ理由（GitHub Releaseへのアセット添付にはcontents: writeが要る）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # 所有者の実機(OPPO Pad Air, Snapdragon 680)はarm64のみなので、CIでビルドする
      # Rustターゲットもaarch64-linux-androidだけに絞る(2026-09-23追記。以前は
      # armv7/i686/x86_64も含む4アーキ全部をビルドしていたが、実機で使わない
      # x86_64(エミュレータ向け)等を含めるとビルド時間とAPKサイズが無駄に増えるだけ
      # だった)。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # android-actions/setup-android@v3のpackages既定値は"tools platform-tools"だが、
      # "tools"パッケージはGoogleのSDKリポジトリから既に削除されており、既定のまま
      # 実行すると`sdkmanager`が"Failed to find package 'tools'"で失敗する
      # (2026-09-23、run 35847261259で実際に再現した)。"tools"を含めず、
      # 実際に使う"platform-tools"だけを明示して回避する。
      #
      # setup-android自体を外してrunner標準のANDROID_HOMEだけに頼る案も検討したが、
      # このactionが担うライセンス受諾(accept-android-sdk-licenses)まで失うと、
      # ビルド中にAndroid Gradle Pluginが未取得のSDKパッケージを取りに行った際に
      # ライセンス未受諾で失敗するリスクがある。actionはそのまま使い、
      # packagesの指定だけを直す方が変更が小さく確実だと判断した。
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true
      - name: NDK_HOME を設定する
        run: echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      # debug署名鍵(~/.android/debug.keystore)。CIランナーは毎回まっさらなので、
      # キャッシュしないと実行のたびに鍵が変わり、「新しい版を上書きインストールできず、
      # いったんアンインストールが必要になる」(Androidは署名が変わったAPKの
      # 上書きインストールを拒否する)。秘密鍵・keystoreは生成しない方針(タスクシート
      # 参照)のため、ここでは「一度作ったdebug鍵をキャッシュして使い回す」ことで
      # 対処する(debug鍵はAndroid標準の固定パスワードのみで保護される低リスクな鍵
      # であり、ADR-0004が言う「秘密鍵」とは性質が異なる。詳細はM3-3の記録を参照)。
      - name: debug.keystore をキャッシュする
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      # 2026-09-23追記: 当初「Tauriが生成するAndroidプロジェクトの"release"ビルドタイプは
      # 既定でdebugのsigningConfigを指す」と考えていたが、実際にrun 35875956360で
      # 確認したところ誤りだった。`--debug`を外すとGradleは"release"ビルドタイプを
      # 使うが、signingConfigは未設定のままで、`app-universal-release-unsigned.apk`
      # という**未署名**のAPKが生成され、かつ`~/.android/debug.keystore`自体も
      # 生成されなかった(そのビルドでは"debug"ビルドタイプを一切使わないため、
      # Android Gradle Pluginの自動生成が起きない。actions/cacheのログにも
      # "Path Validation Error: ...do(es) not exist, hence no cache is being saved"
      # と出た)。そのため、鍵が無ければここで明示的に用意する。
      # keytool -genkeypairでの生成はAndroid Gradle Pluginが自らdebug鍵を
      # 自動生成する際とまったく同じ固定パラメータ(store/keyパスワード"android"、
      # alias"androiddebugkey")を使っており、新しい秘密の運用ルールを持ち込むもの
      # ではない(このタスクの「秘密鍵・keystoreを生成しない」制約は、更新manifest用の
      # 署名鍵やAndroidのリリース用keystoreのような、失われたり漏れたりすると
      # 困る秘密鍵についての制約であり、公開されたパスワードしか持たないdebug鍵は
      # 対象外と判断した)。
      - name: debug.keystore が無ければ生成する
        shell: bash
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - run: npm ci
      - name: tauri android init
        run: npm run tauri android init
      # 2026-09-23追記: 従来`--debug`を付けていたが、`--debug`はGradleのビルドタイプ
      # だけでなくRust側もdebugプロファイル(最適化なし)でビルドしてしまい、
      # 実機でのLAZ展開が大幅に遅くなる(点群ビューアとして致命的)。
      # `tauri android build`は`--debug`を付けなければ既定でRust/Gradleとも
      # リリース(最適化)ビルドになる（`tauri android build --help`の説明冒頭に
      # 明記されている。実際にビルド時間・APKサイズの両方でdebugビルドとの違いを
      # run 35875956360で確認した: 493MB→6.8MB)。署名は下のstepでdebug鍵を使って
      # 後付けする(上記のとおりGradle側は未署名のまま出すため)。`--target aarch64`で
      # 対象ABIを所有者の実機(arm64)だけに絞り、使わないarmv7/i686/x86_64向けの分で
      # APKが膨らまないようにする(x86_64はエミュレータ向けで実機では使わない。
      # ビルドログでarm64-v8a向けの.soしかjniLibsに入っていないことを確認済み)。
      - name: tauri android build (release最適化、arm64のみ)
        run: npm run tauri android build -- --target aarch64 --apk
      - name: APKにdebug鍵で署名する(zipalign→apksigner)
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk')
          OUT_DIR=$(dirname "$UNSIGNED")
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "build-toolsがランナーに見つからないため、sdkmanagerで取得します"
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager | head -1)
            yes | "$SDKMANAGER" "build-tools;35.0.0"
            BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/35.0.0"
          fi
          echo "using build-tools: $BUILD_TOOLS_DIR"
          ALIGNED="$OUT_DIR/app-aligned.apk"
          SIGNED="$OUT_DIR/app-universal-release-debug-signed.apk"
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks ~/.android/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey \
            --out "$SIGNED" "$ALIGNED"
          # 署名前のファイルを残すと後続のuploadで未署名APKまで拾ってしまうため消す。
          rm -f "$UNSIGNED" "$ALIGNED"
      - name: 生成されたAPKを確認する
        shell: bash
        run: |
          echo "--- src-tauri/gen/android/app/build/outputs/apk 以下 ---"
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -exec ls -lh {} \; 2>&1 || echo "(APKが見つかりません)"
      - name: Upload APK to GitHub Release
        # workflow_dispatchでの手動実行ではReleaseを作らない（ビルド確認だけの経路）。
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          # windowsジョブと同じ理由。ファイルが1つも見つからない場合に黙って
          # 「成功」させない。
          fail_on_unmatched_files: true
