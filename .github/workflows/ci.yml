name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:circular
      - name: Check docs
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            npm run check:docs -- --base "$BASE"
          else
            npm run check:docs
          fi
      - run: npm run check:comments
      - run: npm run test

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: "規約1: pcv-core が wasm32 でビルドできる"
        run: cargo build -p pcv-core --target wasm32-unknown-unknown

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo fmt --manifest-path vendor/copc-writer/Cargo.toml -- --check
      - run: cargo test --manifest-path vendor/copc-writer/Cargo.toml

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Playwrightブラウザのキャッシュ
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright Chromium(フルバイナリ + ヘッドレスシェル)の導入
        run: npx playwright install --with-deps chromium

      - name: Machine info (for crash diagnosis)
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Flags' | cut -c1-300
          free -m
      - run: npm run e2e
        env:
          DEBUG: pw:browser
      - name: Memory and OOM killer after E2E (for crash diagnosis)
        if: always()
        run: |
          free -m
          sudo dmesg | grep -iE 'oom|killed process|out of memory' || echo "no OOM killer messages"

      - name: 失敗時にtest-results(トレース・スクリーンショット)を保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  build:
    needs: [frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
