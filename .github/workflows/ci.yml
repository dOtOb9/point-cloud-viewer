name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # I-1 (ADR-0014): Dock.uiだけ直して生成し忘れると、ここでCIが落ちる。
      - run: npm run ui:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  # ARCHITECTURE.md の規約をCIで機械的に守らせる。
  # この2つが崩れると Web 版が出せなくなるが、崩れても通常のビルドは通ってしまうため、
  # 人間のレビューに頼らずここで落とす。
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # 規約1: pcv-core は tauri に依存せず、wasm32 でビルドできること。
      # これが Web 版のバックエンドが成立する条件 (ADR-0001)。
      - name: "規約1: pcv-core が wasm32 でビルドできる"
        run: cargo build -p pcv-core --target wasm32-unknown-unknown

      # 規約2: Tauri の API を import してよいのは src/datasource/tauri.ts だけ。
      # 他所に漏れると Web 版で HttpSource に差し替えられなくなる (ADR-0001)。
      - name: "規約2: Tauri API の import が datasource に閉じている"
        run: |
          allowed="src/datasource/tauri.ts"
          found=$(grep -rl "@tauri-apps/api" src/ || true)
          if [ "$found" != "$allowed" ]; then
            echo "::error::Tauri API を import してよいのは $allowed だけです。"
            echo "実際に import しているファイル:"
            echo "$found" | sed 's/^/  /'
            echo "理由は TaskSheets/ADR-0001-architecture.md の「Tauri 依存を1ファイルに閉じ込める」を参照。"
            exit 1
          fi
          echo "OK: $allowed のみ"

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # 2026-10-07の緊急修正(M4-8追記): vendor/copc-writerはルートworkspaceの
      # exclude対象(Cargo.tomlのコメント参照)で、ここまでの`--workspace`では
      # 一切リントもテストもされない(`[patch.crates-io]`経由の依存先として
      # コンパイルされるだけ)。実際、この不具合(本番の変換経路が無条件に
      # `Instant::now()`を呼び、wasm32で`unreachable`で落ちる)はCIが素通りの
      # ままM4-8から入っていた。fmt/testはここ(ネイティブ)で見る。
      # disallowed_methodsの検査(再発防止)は、このクレートに`web_time`を
      # 導入したことに伴い、ネイティブ向けの検査からは意図的に外してある
      # (`vendor/copc-writer/clippy.toml`のコメント、`.github/workflows/pages.yml`
      # 参照: ネイティブでは`web_time::Instant`が`std::time::Instant`への単純な
      # 再エクスポートになるため、正しく`web_time`経由で呼んでいるコードも
      # `std::time::Instant::now`として解決されてしまい、ネイティブでこのlintを
      # 有効にすると正しいコードまで誤って弾いてしまうことを実際に確認した)。
      - run: cargo fmt --manifest-path vendor/copc-writer/Cargo.toml -- --check
      - run: cargo test --manifest-path vendor/copc-writer/Cargo.toml

  # TaskSheets/ADR-0016-e2e-web-conversion.md参照。
  #
  # 「テスト・CIが緑のまま、実際のブラウザでは壊れている」という不具合
  # (wasmでの時刻panic・FileReaderSyncの無バッファ・OPFSハンドルの衝突・
  # 変換完了後に内訳とダウンロードが即座に消える、など)が繰り返し起きていた。
  # いずれもWeb版の変換を実ブラウザで1回通せば見つかる不具合だったため、
  # ヘッドレスChromiumで実際に変換を1回通すE2E(`playwright.config.ts`・
  # `e2e/`)をここに追加する。他のジョブを待たず独立に走らせる(frontendの
  # lint/typecheckとは別の懸念であり、並行させてCI全体の所要時間を増やさない)。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ブラウザ本体(200MB超)のダウンロードをキャッシュする(タスクの要求)。
      # OS依存ライブラリの`apt-get install`(`--with-deps`)はキャッシュしない
      # (ubuntu-latestのイメージに大半が既に入っており、ヒットしてもそれほど
      # 速くならない一方、キャッシュの構築・検証コストだけが増えるため)。
      - name: Playwrightブラウザのキャッシュ
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright Chromium(フルバイナリ + ヘッドレスシェル)の導入
        run: npx playwright install --with-deps chromium

      # 診断用(一時的): Linux(ubuntu-latest)でヘッドレスChromiumの
      # WebGPUがどの起動フラグなら動くかをここで確かめる
      # (`scripts/diag-webgpu-headless.mjs`)。原因調査のための一時的な
      # ステップで、結果が分かり次第`playwright.config.ts`に反映して
      # このステップは外す(`TaskSheets/ADR-0016-e2e-web-conversion.md`参照)。
      - name: "診断(一時的): Linux headless ChromiumでのWebGPU起動フラグ"
        run: node scripts/diag-webgpu-headless.mjs

      # `playwright.config.ts`のwebServerが`npm run build && npm run preview`
      # (本番=GitHub Pagesと同じサブパスでビルドしたもの)を自動で起動するので、
      # ここでは`playwright test`を呼ぶだけでよい。
      - run: npm run e2e

      # 失敗したときに原因を追えるように、トレース・スクリーンショットを
      # 保存する(CI実行のartifactとしてのみ残る。`test-results/`は
      # .gitignore済みでリポジトリには入らない)。
      - name: 失敗時にtest-results(トレース・スクリーンショット)を保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  # 13秒で終わる frontend だけを前提にする。
  # rust ジョブ (5分超) を待つと build と直列になり、CI 全体が倍近く遅くなるため待たない。
  build:
    needs: [frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # インストーラ生成 (WiX/NSIS) は含めず、実行ファイルのビルドが通ることだけを確認する。
      - run: npm run tauri build -- --no-bundle
