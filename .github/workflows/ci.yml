name: CI

# Every branch and every pull request, whatever its base (AGENTS.md: the coordinator pushes a work branch and checks CI before
# merging; stacked pull requests whose base is not main must be green on their own too).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # check:docs diffs against the base commit
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The layer rules (ARCHITECTURE.md rules 2, 3, 5; ADR-0023 for src/plugins) are ESLint `no-restricted-imports`
      # rules in eslint.config.js, so `npm run lint` checks them. Tests: src/layer-rules.test.ts.
      - run: npm run lint
      # No import cycles in src/ (type-only imports count). RF-1.
      - run: npm run check:circular
      # Documents state facts about the code, so two checks run here (npm run check:docs):
      #  - scripts/check-doc-paths.mjs: the paths and relative links in ARCHITECTURE.md, ROADMAP.md and CLAUDE.md exist (RECURRENCE RF-0/1/15).
      #  - scripts/check-adr.mjs: a new ADR (>= 0024) names the code it depends on and the references are real (TaskSheets/ADR-TEMPLATE.md).
      #    With --base (the commit before this push / the base of this pull request) an ADR changed since then also gets the strict
      #    line-distance check. If the base is unknown (first push, force push) it runs without --base.
      - name: Check docs
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            npm run check:docs -- --base "$BASE"
          else
            npm run check:docs
          fi
      - run: npm run test

  # ARCHITECTURE.md の規約1・2・3・5をCIで機械的に守らせる（規約4は検査の対象外）。
  # 崩れると Web 版が出せなくなるが、崩れても通常のビルドは通ってしまうため、
  # 人間のレビューに頼らずここで落とす。規約1はこのジョブ、規約2・3・5は frontend ジョブの
  # `npm run lint`（ESLint のルール）、循環の検査（madge）も frontend ジョブ。
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # 規約1: pcv-core は tauri に依存せず、wasm32 でビルドできること。
      # これが Web 版のバックエンドが成立する条件 (ADR-0001)。
      - name: "規約1: pcv-core が wasm32 でビルドできる"
        run: cargo build -p pcv-core --target wasm32-unknown-unknown

      # Rules 2, 3 and 5 (Tauri packages only in src/datasource/tauri.ts; no React in src/renderer and src/app;
      # no src/state/use* in src/app) used to be grep steps here. They are ESLint rules now and run in the
      # `frontend` job (`npm run lint`), because grep also failed on a comment that merely named a package
      # and missed `@tauri-apps/plugin-*` (RF-1).

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # 2026-10-07の緊急修正(M4-8追記): vendor/copc-writerはルートworkspaceの
      # exclude対象(Cargo.tomlのコメント参照)で、ここまでの`--workspace`では
      # 一切リントもテストもされない(`[patch.crates-io]`経由の依存先として
      # コンパイルされるだけ)。実際、この不具合(本番の変換経路が無条件に
      # `Instant::now()`を呼び、wasm32で`unreachable`で落ちる)はCIが素通りの
      # ままM4-8から入っていた。fmt/testはここ(ネイティブ)で見る。
      # disallowed_methodsの検査(再発防止)は、このクレートに`web_time`を
      # 導入したことに伴い、ネイティブ向けの検査からは意図的に外してある
      # (`vendor/copc-writer/clippy.toml`のコメント、`.github/workflows/pages.yml`
      # 参照: ネイティブでは`web_time::Instant`が`std::time::Instant`への単純な
      # 再エクスポートになるため、正しく`web_time`経由で呼んでいるコードも
      # `std::time::Instant::now`として解決されてしまい、ネイティブでこのlintを
      # 有効にすると正しいコードまで誤って弾いてしまうことを実際に確認した)。
      - run: cargo fmt --manifest-path vendor/copc-writer/Cargo.toml -- --check
      - run: cargo test --manifest-path vendor/copc-writer/Cargo.toml

  # TaskSheets/ADR-0016-e2e-web-conversion.md参照。
  #
  # 「テスト・CIが緑のまま、実際のブラウザでは壊れている」という不具合
  # (wasmでの時刻panic・FileReaderSyncの無バッファ・OPFSハンドルの衝突・
  # 変換完了後に内訳とダウンロードが即座に消える、など)が繰り返し起きていた。
  # いずれもWeb版の変換を実ブラウザで1回通せば見つかる不具合だったため、
  # ヘッドレスChromiumで実際に変換を1回通すE2E(`playwright.config.ts`・
  # `e2e/`)をここに追加する。他のジョブを待たず独立に走らせる(frontendの
  # lint/typecheckとは別の懸念であり、並行させてCI全体の所要時間を増やさない)。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ブラウザ本体(200MB超)のダウンロードをキャッシュする(タスクの要求)。
      # OS依存ライブラリの`apt-get install`(`--with-deps`)はキャッシュしない
      # (ubuntu-latestのイメージに大半が既に入っており、ヒットしてもそれほど
      # 速くならない一方、キャッシュの構築・検証コストだけが増えるため)。
      - name: Playwrightブラウザのキャッシュ
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright Chromium(フルバイナリ + ヘッドレスシェル)の導入
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts`のwebServerが`npm run build && npm run preview`
      # (本番=GitHub Pagesと同じサブパスでビルドしたもの)を自動で起動するので、
      # ここでは`playwright test`を呼ぶだけでよい。
      #
      # Diagnostics for the intermittent "Target crashed" (2026-10-18): the tab dies 1.5-3 s after a
      # conversion starts, right after "WebGPU device lost", and it happens to whole CI runs at once.
      # These logs let us compare failing and passing runs: which machine (CPU / memory) the run got,
      # Chromium's own stderr (GPU process exit messages; `DEBUG=pw:browser` makes Playwright print it),
      # and whether the kernel's OOM killer stopped a process.
      - name: Machine info (for crash diagnosis)
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Flags' | cut -c1-300
          free -m
      - run: npm run e2e
        env:
          DEBUG: pw:browser
      - name: Memory and OOM killer after E2E (for crash diagnosis)
        if: always()
        run: |
          free -m
          sudo dmesg | grep -iE 'oom|killed process|out of memory' || echo "no OOM killer messages"

      # 失敗したときに原因を追えるように、トレース・スクリーンショットを
      # 保存する(CI実行のartifactとしてのみ残る。`test-results/`は
      # .gitignore済みでリポジトリには入らない)。
      - name: 失敗時にtest-results(トレース・スクリーンショット)を保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  # 13秒で終わる frontend だけを前提にする。
  # rust ジョブ (5分超) を待つと build と直列になり、CI 全体が倍近く遅くなるため待たない。
  build:
    needs: [frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # インストーラ生成 (WiX/NSIS) は含めず、実行ファイルのビルドが通ることだけを確認する。
      - run: npm run tauri build -- --no-bundle
