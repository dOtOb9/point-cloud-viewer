name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/pcv-wasm -> target"

      - name: pcv-wasmのユニットテスト(ネイティブ、Worker非依存部分のみ)
        run: cargo test --manifest-path crates/pcv-wasm/Cargo.toml

      - name: pcv-wasmのfmt/clippy
        run: |
          cargo fmt --manifest-path crates/pcv-wasm/Cargo.toml -- --check
          cargo clippy --manifest-path crates/pcv-wasm/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: vendor/copc-writerのInstant::now直接呼び出しを禁止(wasm32)
        run: |
          cargo clippy --manifest-path vendor/copc-writer/Cargo.toml \
            --no-default-features --target wasm32-unknown-unknown --lib \
            -- -D clippy::disallowed_methods

      - name: wasm-bindgen-cliのバージョンをCargo.lockに合わせて決定する
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' crates/pcv-wasm/Cargo.lock | tail -1 | cut -d '"' -f2)
          echo "WASM_BINDGEN_VERSION=$version" >> "$GITHUB_ENV"
      - name: wasm-bindgen-cliのインストール
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: pcv-wasm を release ビルドし、wasm-bindgenでJSグルーを生成（ビルドした場所のパスを付け替える）
        run: npm run build:wasm
      - name: Pages に出す wasm にビルドした場所の絶対パスが無い
        run: npm run check:wasm-paths

      - name: Committed wasm glue (JS and types) is up to date
        run: |
          if ! npm run check:wasm-glue; then
            echo "::error::src/wasm/pcv-wasm/ is stale. Run 'npm run build:wasm' and commit the result."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

      - name: 静的ビルド(vite build、Pagesのサブパス向け)
        run: npm run build
        env:
          GITHUB_PAGES_BUILD: "true"

      - name: mdBookの導入
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"
      - name: 本をビルドする
        run: mdbook build docs/book
      - name: 本をアプリの成果物の book/ 以下に配置する
        run: |
          mkdir -p dist/book
          cp -r docs/book/book/. dist/book/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
