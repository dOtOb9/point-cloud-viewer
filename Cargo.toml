[workspace]
resolver = "2"
members = ["crates/pcv-core", "crates/pcv-convert", "src-tauri"]
exclude = ["vendor", "crates/pcv-wasm"]

[workspace.package]
license = "MIT OR Apache-2.0"
authors = ["dOtOb9"]
repository = "https://github.com/dOtOb9/point-cloud-viewer"

[patch.crates-io]
copc-reader = { path = "vendor/copc-reader" }
copc-writer = { path = "vendor/copc-writer" }
laz = { path = "vendor/laz" }

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = 3
strip = true
