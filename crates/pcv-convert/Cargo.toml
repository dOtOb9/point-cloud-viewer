[package]
name = "pcv-convert"
version = "0.1.0"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "M4-1のスパイク実装(素朴な全点メモリ実装)と、M4-3の本番変換経路(copc-writerを使ったout-of-core変換)。pcv-coreには含めない(規約1。ARCHITECTURE.mdの守る規約1参照)"

# 依存を追加するときの注意:
# このクレートは規約1(pcv-coreがwasm32-unknown-unknownでビルドできること)の対象外。
# `las`/`laz`はwasm互換性を確認していないネイティブ専用の依存として扱う。
# pcv-coreはこのクレートに依存しない(逆方向の依存だけを許す)。
[dependencies]
# COPCのバイナリ構造(hierarchy entry・COPC info VLR)はpcv-coreの読み込み側(ADR-0003)と
# 同じcopc-coreの型をそのまま流用する。書式の定義を2箇所で持たないため。
copc-core = "0.9.0"
# 入力LAS/LAZの読み込みと、出力点の生バイト列(raw::Point)へのシリアライズに使う。
# M4-7(TaskSheets/M4-import-and-conversion.md): `laz-parallel`フィーチャは`las`クレートが
# 既に持っている並列LAZ展開(`laz`クレートの`parallel`フィーチャ、rayon使用)への入口で、
# 自前でチャンク分担のコードを書く前に「あれば使う」の判断で採用した。有効にするだけで
# `las::Reader::new`が内部で`laz::ParLasZipDecompressor`(チャンクテーブル1本をrayonの
# スレッドプールで分担して展開する。チャンク間に依存が無いことはLAZの仕様上保証されている)
# に切り替わる。詳細な実測はADR-0007の追記に倣って`examples/read_stage_bench.rs`、
# 判断の根拠はTaskSheets/M4-import-and-conversion.mdのM4-7参照。
las = { version = "0.10", features = ["laz", "laz-parallel"] }
# LAZチャンク圧縮そのもの(可変長チャンクモード)。COPCの1ノード=1チャンクに対応させる。
laz = "0.12"
byteorder = "1"
thiserror = "2"
# M4-1b/M4-3: out-of-core(streaming)変換。ADR-0006で本番の変換経路として採用した。
# copc-core/copc-reader(ADR-0003)と同じroteiro-gis/copc-rustの姉妹クレートで、
# 版が揃っているため依存解決の衝突は起きない(実測してビルドを確認済み)。
# pcv-coreはこのクレートに依存しないので規約1には影響しない。
#
# M4-8(TaskSheets/M4-import-and-conversion.md): 後処理の内訳を実測した結果、
# octreeの分割(LOD構築)が後処理全体の約半分〜7割を占める最大の部分だった。
# この分割は「ルート直下のオクタントごとに独立」という構造なので、
# `parallel-lod`フィーチャ(rayon使用。デスクトップ・Androidのみ)で並列化した。
#
# M4-10(TaskSheets/M4-import-and-conversion.md): M4-8では`parallel-compress`
# (ノードごとのLAZ圧縮。copc-writerにupstreamから元々あった実装)を有効にしていなかった。
# 実測したところネイティブの出力がバイト単位で変わる(ファイルサイズ自体が数バイト違う。
# 連続した1本の圧縮器でチャンク境界ごとに`finish_current_chunk()`する場合と、
# ノードごとに新しい圧縮器を作って独立に圧縮する場合とで、LAZの圧縮バイト列そのものが
# 異なる。`laz`クレート内部の挙動差が原因と見られる)ため、当時の「バイト単位の一致を
# 保てない場合は期待値を書き換えずに止まる」という約束に従って見送っていた。
#
# M4-10で、所有者がこの条件を「点の集合が一致すること」へ緩めることを承認した
# (2026-10-03)。バイト列の差分は並べ替え・チャンク区切り・圧縮の詳細だけで、
# 点の内容(座標・強度・分類・色の多重集合、ノード構成)は変わらないことを確認した
# (`vendor/copc-writer/PATCH.md`のM4-10追記、`crates/pcv-convert/tests/
# streaming_conversion.rs`の`parallel_compress_point_set_matches_sequential`参照)ため、
# デスクトップ・Androidで`parallel-compress`を有効にした。
#
# `crates/pcv-wasm`は別のワークスペース(このCargo.tomlとは独立したビルドグラフ)で
# `default-features = false`のまま`copc-writer`に依存しており、このフィーチャの
# 影響を一切受けない(wasm32向けビルドに`rayon`が入り込むことはない)。
copc-writer = { version = "0.9.0", features = ["parallel-lod", "parallel-compress"] }

# M4-4: E57/PLY/PCD → LAS のインポータ(src/import/)。選定理由はADR-0008に追記。
e57 = "0.11.13"
pcd-rs = "0.13.0"

# M4-3: CRSの手当て(crs_override.rs)で、M4-5が検証済みの平面直角座標系/UTMの
# ゾーンパラメータを再利用するために依存する(検証済みの数値・変換式を2箇所で
# 持たないため)。変換結果が実際に`pcv-core`で開けるかのテスト(M4-1・M4-3の
# 受け入れ条件)にも使う。pcv-core側はこのクレートに依存しない(逆方向のみ許可、規約1)。
pcv-core = { path = "../pcv-core" }
# M4-3: 出力先の書き込み可否プローブ(output_path.rs)。テスト(tempdir)でも使う。
tempfile = "3"

# M4-3: 空き容量の確認(disk_space.rs)。デスクトップ(Windows)は`GetDiskFreeSpaceExW`。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

# M4-3: 空き容量の確認(disk_space.rs)。Android/Linux/macOSは`statvfs(2)`。
# AndroidはLinuxカーネルの上で動くため、JNIを介さず素のRustから呼べる。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "pcv-convert"
path = "src/main.rs"

# M4-6b: 回帰テスト(streaming_conversion.rsの
# native_output_hash_matches_recorded_value)が、合成LASの作成日時を固定する
# ために使う(日付を固定しないと、copc-writerの`to_output()`が未設定の
# creation_dateを実行時の今日の日付で埋めるため、出力ハッシュが実行日ごとに
# 変わってしまう不具合が実際に起きた)。`chrono`はlas/copc-writer経由で既に
# 依存グラフに入っているため、ワークスペース全体では新規クレートは増えない。
[dev-dependencies]
chrono = "0.4"
