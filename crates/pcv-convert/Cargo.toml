[package]
name = "pcv-convert"
version = "0.1.0"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "デスクトップ版の本番の変換器(copc-writerを使ったout-of-core変換、E57/PLY/PCD取り込み、結合・DTM・ラスタ・間引き)。M4-1のスパイクの素朴な全点メモリ実装も残す。pcv-coreには含めない(規約1。ARCHITECTURE.mdの守る規約1参照)"

[dependencies]
copc-core = "0.9.0"
copc-reader = "0.9.0"
las = { version = "0.10", features = ["laz", "laz-parallel"] }
laz = "0.12"
byteorder = "1"
thiserror = "2"
copc-writer = { version = "0.9.0", features = ["parallel-lod", "parallel-compress"] }

e57 = "0.11.13"
pcd-rs = "0.13.0"

pcv-core = { path = "../pcv-core" }
tempfile = "3"
glob = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "pcv-convert"
path = "src/main.rs"

[dev-dependencies]
chrono = "0.4"
tiff = "0.11.3"
