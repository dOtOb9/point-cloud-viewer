[workspace]

[package]
name = "pcv-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["dOtOb9"]
repository = "https://github.com/dOtOb9/point-cloud-viewer"
description = "pcv-core を wasm-bindgen で包み、Web Worker から呼べるようにする層。wasm 固有の依存(wasm-bindgen/js-sys/web-sys)はここに閉じ、pcv-core には持ち込まない(ARCHITECTURE.md 規約1)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pcv-core = { path = "../pcv-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
copc-core = "0.9.0"
copc-reader = "0.9.0"
las = { version = "0.10", features = ["laz"] }
copc-writer = { version = "0.9.0", default-features = false }
pcd-rs = "0.13.0"
byteorder = "1"
e57 = "=0.11.13"
web-time = "1"

[dependencies.web-sys]
version = "0.3"
features = [
  "File",
  "Blob",
  "FileReaderSync",
  "XmlHttpRequest",
  "XmlHttpRequestResponseType",
  "console",
  "FileSystemSyncAccessHandle",
  "FileSystemReadWriteOptions",
]

[patch.crates-io]
copc-reader = { path = "../../vendor/copc-reader" }
copc-writer = { path = "../../vendor/copc-writer" }
laz = { path = "../../vendor/laz" }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
