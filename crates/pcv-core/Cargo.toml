[package]
name = "pcv-core"
version = "0.1.0"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "COPC読込・octree走査・解析アルゴリズム。tauri に依存しない（wasm ターゲットでビルドできることが条件）"

[dependencies]
copc-core = "0.9.0"
copc-reader = "0.9.0"
thiserror = "2"
las = "0.10"
serde = { version = "1", features = ["derive"] }
spade = "2.15.1"

[dev-dependencies]
copc-writer = "0.9.0"
tempfile = "3"
serde_json = "1"
tiff = "0.11.3"
