[package]
name = "pcv-tauri"
version = "0.1.4"
description = "Point Cloud Viewer - Tauri shell"
license.workspace = true
authors.workspace = true
repository.workspace = true
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pcv_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pcv-core = { path = "../crates/pcv-core" }
# M4-3: LAS/LAZ→COPCの変換(conversion.rs)。実際の変換ロジックはpcv-convertに
# 任せ、ここはTauriコマンド・イベントの薄い配線だけを持つ(ARCHITECTURE.md)。
pcv-convert = { path = "../crates/pcv-convert" }
copc-writer = "0.9.0"
copc-core = "0.9.0"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
log = "0.4.34"
# `pcv://`のパスのパーセントデコード用（`lib.rs`の`parse_pcv_path`参照）。
# フロントは`convertFileSrc`でURLを組み立てるが、この関数は引数全体を
# 1回の`encodeURIComponent`でエンコードするため、パスの区切り文字（`/`）も
# `%2F`になって届く。新しい依存に見えるが、`url`クレート（`tauri`が内部で
# 使っている）が既にこの正確なバージョンをビルドグラフに含んでいる
# （`Cargo.lock`の`percent-encoding 2.3.2`）ため、直接依存を1行足しても
# ビルドに新しいクレートが増えるわけではない。
percent-encoding = "2.3"

[dev-dependencies]
# open_copc/read_node_bytes をテストするために、その場で極小のCOPCを生成する。
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11.11"
