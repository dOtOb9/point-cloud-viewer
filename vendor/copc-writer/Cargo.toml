# 空の`[workspace]`テーブルを足した(ルートの`Cargo.toml`が`vendor`を
# `exclude`しているため、このクレート自身が独立したワークスペースの根で
# あることを明示しないとcargoが混乱する)。
[workspace]

[package]
edition = "2021"
rust-version = "1.88"
name = "copc-writer"
version = "0.9.0"
build = false
exclude = [
    "tests/**",
    "benches/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pure-Rust COPC writer with streaming LAS intake"
homepage = "https://github.com/roteiro-gis/copc-rust"
documentation = "https://docs.rs/copc-writer"
readme = "README.md"
keywords = [
    "copc",
    "las",
    "laz",
    "point-cloud",
    "gis",
]
categories = [
    "science",
    "encoding",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/roteiro-gis/copc-rust"

[features]
default = ["native-fs"]
# M4-6a: OS一時ファイル(tempfile)とメモリマップ(memmap2)を使う既定実装
# (`NativeScratchFs`、`src/scratch.rs`)を切り出したフィーチャ。切ると
# この2クレートへの依存自体が外れ、メモリ上の実装(`MemoryScratchFs`)だけが
# 残る。
native-fs = ["dep:tempfile", "dep:memmap2"]
# ADR-0019: `parallel-compress` turns on the worker threads that build octree
# subtrees in memory and compress their nodes (`src/node_pipeline.rs`). They
# are plain `std::thread`s now, so `rayon` is no longer a dependency. Web
# (wasm32) leaves it off and runs everything on one thread.
# `parallel-lod` used to switch on the parallel octree split (M4-8). The split
# is part of the same pipeline now; the name stays, doing nothing, so that
# dependents' feature lists (`crates/pcv-convert`) keep resolving.
parallel = ["parallel-lod", "parallel-compress"]
parallel-lod = []
parallel-compress = []

[lib]
name = "copc_writer"
path = "src/lib.rs"

[dependencies.byteorder]
version = "1"

[dependencies.copc-core]
version = "0.9.0"

[dependencies.las]
version = "0.10"
features = ["laz"]

[dependencies.laz]
version = "0.12"

[dependencies.memmap2]
version = "0.9"
optional = true

[dependencies.tempfile]
version = "3"
default-features = false
optional = true

# 2026-10-07の緊急修正: `std::time::Instant::now`/`SystemTime::now`は
# wasm32-unknown-unknownでpanicする(`src/writer.rs`・`src/metadata.rs`の
# コメント参照)。`web-time`はnon-wasmターゲットでは`std::time`への単純な
# 再エクスポートになり、wasm32では`Date`/`performance.now()`を使う実装に
# 自動的に切り替わる(クレート自身の売りがこれ)。両ターゲットで同じAPIを
# 使い続けられるので、呼び出し側(`write_copc_inner`・`current_utc_date`)の
# ロジックを変えずに済む。
[dependencies.web-time]
version = "1"

[dev-dependencies.criterion]
version = "0.8"

# M4-6: `autotests = false`(上記、crates.io公開時の自動生成設定)のため、
# `tests/`配下のファイルは明示的に[[test]]で宣言しないと`cargo test`が
# 見つけてくれない。M4-6のOPFS不具合(一時ファイルを丸ごとメモリへ読み込む
# バグ)の回帰テスト。`vendor/copc-writer/tests/scratch_read_is_bounded.rs`
# 参照。
[[test]]
name = "scratch_read_is_bounded"
path = "tests/scratch_read_is_bounded.rs"

# ADR-0019: the disk runs are deleted as soon as they are partitioned, and
# the heap does not grow with the point count.
[[test]]
name = "lod_runs_bounded"
path = "tests/lod_runs_bounded.rs"

# The heap peak does not grow with the point count (counting allocator).
[[test]]
name = "heap_is_bounded"
path = "tests/heap_is_bounded.rs"
required-features = ["native-fs"]

# Cancellation works in the disk levels and in the worker threads.
[[test]]
name = "lod_cancel"
path = "tests/lod_cancel.rs"

# Cancellation works in the compression phase.
[[test]]
name = "compress_cancel"
path = "tests/compress_cancel.rs"


# L3-C: spill records with i32 coordinates give the same file as f64 ones.
[[test]]
name = "compact_records_match_wide"
path = "tests/compact_records_match_wide.rs"
required-features = ["native-fs"]
