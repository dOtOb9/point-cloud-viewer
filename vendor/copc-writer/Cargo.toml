# あることを明示しないとcargoが混乱する)。
[workspace]

[package]
edition = "2021"
rust-version = "1.88"
name = "copc-writer"
version = "0.9.0"
build = false
exclude = [
    "tests/**",
    "benches/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pure-Rust COPC writer with streaming LAS intake"
homepage = "https://github.com/roteiro-gis/copc-rust"
documentation = "https://docs.rs/copc-writer"
readme = "README.md"
keywords = [
    "copc",
    "las",
    "laz",
    "point-cloud",
    "gis",
]
categories = [
    "science",
    "encoding",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/roteiro-gis/copc-rust"

[features]
default = ["native-fs"]
# M4-6a: OS一時ファイル(tempfile)とメモリマップ(memmap2)を使う既定実装
# (`NativeScratchFs`、`src/scratch.rs`)を切り出したフィーチャ。切ると
# この2クレートへの依存自体が外れ、メモリ上の実装(`MemoryScratchFs`)だけが
# 残る。
native-fs = ["dep:tempfile", "dep:memmap2"]
# M4-8(TaskSheets/M4-import-and-conversion.md): 元々`parallel`はノードごとの
# LAZ圧縮(`writer.rs`のcompress_nodes、upstreamが元から持っていた実装)だけを
# 指していたが、octreeの分割(`lod.rs`のbuild_lod_index)も並列化したため、
# 2つに分けた。`parallel`は両方まとめて有効にする従来どおりの名前として残す。
# 分けた理由: 一方だけが出力のバイト一致を崩した場合に、どちらが原因かを
# 切り分けて計測・判断するため(「測っていないことを実測したと書かない」と
# 同じ精神で、2つの独立した変更を1つのフラグにまとめて検証を曖昧にしない)。
parallel = ["parallel-lod", "parallel-compress"]
parallel-lod = ["dep:rayon"]
parallel-compress = ["dep:rayon"]

[lib]
name = "copc_writer"
path = "src/lib.rs"

[dependencies.byteorder]
version = "1"

[dependencies.copc-core]
version = "0.9.0"

[dependencies.las]
version = "0.10"
features = ["laz"]

[dependencies.laz]
version = "0.12"

[dependencies.memmap2]
version = "0.9"
optional = true

[dependencies.rayon]
version = "1"
optional = true

[dependencies.tempfile]
version = "3"
default-features = false
optional = true

[dev-dependencies.criterion]
version = "0.8"

# M4-6: `autotests = false`(上記、crates.io公開時の自動生成設定)のため、
# `tests/`配下のファイルは明示的に[[test]]で宣言しないと`cargo test`が
# 見つけてくれない。M4-6のOPFS不具合(一時ファイルを丸ごとメモリへ読み込む
# バグ)の回帰テスト。`vendor/copc-writer/tests/scratch_read_is_bounded.rs`
# 参照。
[[test]]
name = "scratch_read_is_bounded"
path = "tests/scratch_read_is_bounded.rs"

# M4-8: octree分割(LOD構築)の並列化(`parallel-lod`フィーチャ)で同時に開く
# 一時ファイルの数が点数に比例しないことの回帰テスト。
# `tests/parallel_lod_open_files_bounded.rs`参照。`parallel-lod`が無効な
# ビルド(既定)ではこのテストはスキップされる。
[[test]]
name = "parallel_lod_open_files_bounded"
path = "tests/parallel_lod_open_files_bounded.rs"
required-features = ["parallel-lod"]

# M4-8: octree分割の並列化後もキャンセルが働くことの回帰テスト。
# `tests/parallel_lod_cancel.rs`参照。
[[test]]
name = "parallel_lod_cancel"
path = "tests/parallel_lod_cancel.rs"
required-features = ["parallel-lod"]
