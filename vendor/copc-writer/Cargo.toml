[workspace]

[package]
edition = "2021"
rust-version = "1.88"
name = "copc-writer"
version = "0.9.0"
build = false
exclude = [
    "tests/**",
    "benches/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pure-Rust COPC writer with streaming LAS intake"
homepage = "https://github.com/roteiro-gis/copc-rust"
documentation = "https://docs.rs/copc-writer"
readme = "README.md"
keywords = [
    "copc",
    "las",
    "laz",
    "point-cloud",
    "gis",
]
categories = [
    "science",
    "encoding",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/roteiro-gis/copc-rust"

[features]
default = ["native-fs"]
# M4-6a: OS一時ファイル(tempfile)とメモリマップ(memmap2)を使う既定実装
# (`NativeScratchFs`、`src/scratch.rs`)を切り出したフィーチャ。切ると
# この2クレートへの依存自体が外れ、メモリ上の実装(`MemoryScratchFs`)だけが
# 残る。
native-fs = ["dep:tempfile", "dep:memmap2"]
parallel = ["dep:rayon"]

[lib]
name = "copc_writer"
path = "src/lib.rs"

[dependencies.byteorder]
version = "1"

[dependencies.copc-core]
version = "0.9.0"

[dependencies.las]
version = "0.10"
features = ["laz"]

[dependencies.laz]
version = "0.12"

[dependencies.memmap2]
version = "0.9"
optional = true

[dependencies.rayon]
version = "1"
optional = true

[dependencies.tempfile]
version = "3"
default-features = false
