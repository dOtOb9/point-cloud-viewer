<!doctype html>
<html lang="ja">
<head><meta charset="utf-8" /><link rel="stylesheet" href="style.css" />
<style>
  .diagram { display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .file-box { display: flex; flex-direction: column; border: 2px solid rgba(255,255,255,0.25); border-radius: 16px; overflow: hidden; width: 1200px; }
  .row { display: flex; align-items: center; }
  .seg { padding: 22px 20px; font-size: 24px; border-right: 1px solid rgba(255,255,255,0.15); }
  .seg:last-child { border-right: none; }
  .header { background: rgba(147,197,253,0.18); color: #93c5fd; font-weight: 700; }
  .hierarchy { background: rgba(192,132,252,0.18); color: #d8b4fe; font-weight: 700; flex: 1.4; }
  .nodes { flex: 4; background: rgba(255,255,255,0.03); }
  .node-chunk { flex: 1; padding: 14px 10px; font-size: 18px; text-align: center; border-right: 1px solid rgba(255,255,255,0.08); color: #cbd5e1; }
  .node-chunk:last-child { border-right: none; }
  .octree { display: flex; gap: 48px; align-items: flex-start; margin-top: 8px; }
  .tree { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 18px; color: #94a3b8; }
  .tree .lvl { display: flex; gap: 10px; }
  .box { width: 34px; height: 34px; border-radius: 6px; background: rgba(147,197,253,0.35); border: 1px solid rgba(147,197,253,0.6); }
  .caption-line { font-size: 24px; color: #cbd5e1; text-align: center; max-width: 1200px; line-height: 1.7; }
</style>
</head>
<body>
<div class="card">
  <div class="badge">COPC（Cloud Optimized Point Cloud）</div>
  <div class="diagram">
    <div class="file-box">
      <div class="row">
        <div class="seg header">LASヘッダー</div>
        <div class="seg hierarchy">hierarchy（どのノードがファイルのどこにあるかの一覧）</div>
      </div>
      <div class="row nodes">
        <div class="node-chunk">root</div>
        <div class="node-chunk">node 1-1</div>
        <div class="node-chunk">node 1-2</div>
        <div class="node-chunk">node 2-1</div>
        <div class="node-chunk">…</div>
      </div>
    </div>
    <div class="octree">
      <div class="tree">
        <div>octree（木の構造）</div>
        <div class="lvl"><div class="box"></div></div>
        <div class="lvl"><div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div></div>
        <div class="lvl"><div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div></div>
      </div>
    </div>
    <p class="caption-line">
      開くときに読むのは hierarchy だけ。あとは見ている場所に必要なノードのかたまりだけを<br/>
      ファイルの該当オフセットから読み込む（ファイル全体を読む必要がない）。
    </p>
  </div>
</div>
</body>
</html>
